name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build e testes (unitários e API)
    runs-on: ubuntu-latest
    env:
      CYPRESS_INSTALL_BINARY: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Instalar dependências (frontend e backend)
        run: npm ci

      - name: Testes unitários do frontend (Vitest)
        run: npx ng test --watch=false

      - name: Checagem de tipos e testes da API (node:test)
        run: |
          npx tsc -p backend --noEmit
          npm run test:api

      - name: Build de produção
        run: npx ng build

  e2e:
    name: E2E (Cypress, modo ${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: navegador
            script: e2e
          - mode: servidor
            script: e2e:server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Cache do binário do Cypress
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - name: Testes E2E
        run: npm run ${{ matrix.script }}

      - name: Screenshots das falhas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-${{ matrix.mode }}
          path: cypress/screenshots
          if-no-files-found: ignore
