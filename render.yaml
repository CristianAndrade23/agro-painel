# Deploy no Render (https://render.com) — Blueprint com um único web service:
# o Express de backend/ serve a API (/api/v1) e o build do Angular na mesma origem.
services:
  - type: web
    name: agro-painel
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm --prefix backend start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # Gera um segredo aleatório para assinar os JWTs.
      - key: JWT_SECRET
        generateValue: true
      # O binário do Cypress (~500 MB) só é necessário para os testes E2E, não no deploy.
      - key: CYPRESS_INSTALL_BINARY
        value: "0"
